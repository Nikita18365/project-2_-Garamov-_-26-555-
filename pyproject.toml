[project]
name = "project-2-garamov-26-555"
version = "0.1.0"
description = "Primitive database project"
readme = "README.md"
authors = [
    { name = "Nikita Garamov" }
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "prompt>=0.4.1,<0.5",
    "prettytable>=3.18.0,<4.0",
]

[project.scripts]
project = "src.primitive_db.main:main"
database = "src.primitive_db.main:main"

[dependency-groups]
dev = [
    "ruff>=0.16.9,<0.17",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
